<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=3.0, user-scalable=yes">
  <title>경영학 PDF 뷰어</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <style>
    :root {
      --bg: #1c1c1e;
      --card: #2c2c2e;
      --bar: rgba(30, 30, 32, 0.85);
      --text: #f5f5f7;
      --sec: #98989f;
      --border: rgba(255, 255, 255, 0.12);
      --accent: #0a84ff;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f2f2f7;
        --card: #ffffff;
        --bar: rgba(255, 255, 255, 0.88);
        --text: #1d1d1f;
        --sec: #6e6e73;
        --border: rgba(0, 0, 0, 0.1);
        --accent: #007aff;
      }
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Apple SD Gothic Neo", sans-serif;
      overflow: hidden; display: flex; flex-direction: column;
    }

    /* ─── 상단 유리 툴바 ─── */
    #toolbar {
      height: 48px; flex: 0 0 auto;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 16px; background: var(--bar);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border-bottom: 0.5px solid var(--border);
      z-index: 100;
    }
    .tb-left, .tb-center, .tb-right {
      display: flex; align-items: center; gap: 8px;
    }
    .tb-title {
      font-size: 14px; font-weight: 700; color: var(--text);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 180px;
    }
    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      height: 32px; padding: 0 10px; border-radius: 999px;
      font-size: 13px; font-weight: 600; color: var(--text);
      background: var(--card); border: 0.5px solid var(--border);
      cursor: pointer; user-select: none; transition: all 0.15s ease;
    }
    .btn:hover { background: rgba(120, 120, 128, 0.16); }
    .btn:active { transform: scale(0.96); }
    .btn-icon { width: 32px; padding: 0; }
    .btn svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }

    /* 페이지 인풋 */
    .page-box {
      display: flex; align-items: center; gap: 4px;
      font-size: 13px; color: var(--sec); font-weight: 500;
    }
    .page-input {
      width: 44px; height: 28px; text-align: center;
      background: var(--card); border: 0.5px solid var(--border);
      border-radius: 6px; color: var(--text); font-weight: 700; font-size: 13px;
    }
    .page-input:focus { outline: none; border-color: var(--accent); }

    /* ─── 뷰어 본문 ─── */
    #viewerContainer {
      flex: 1 1 auto; width: 100%; height: 100%;
      overflow: auto; display: flex; flex-direction: column;
      align-items: center; padding: 16px 8px;
      -webkit-overflow-scrolling: touch;
    }
    #canvasWrapper {
      position: relative; box-shadow: 0 4px 20px rgba(0,0,0,0.18);
      border-radius: 4px; overflow: hidden; background: #fff;
    }
    canvas { display: block; max-width: 100%; height: auto; }

    /* ─── 로딩 & 에러 안내 ─── */
    #loader {
      position: absolute; inset: 48px 0 0 0;
      background: var(--bg); display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 12px; z-index: 50;
      transition: opacity 0.25s ease;
    }
    #loader.hidden { opacity: 0; pointer-events: none; }
    .spinner {
      width: 36px; height: 36px; border: 3px solid rgba(120,120,128,0.2);
      border-top-color: var(--accent); border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loader-text { font-size: 14px; font-weight: 600; color: var(--sec); }

    #errorMsg {
      display: none; padding: 16px 20px; border-radius: 12px;
      background: rgba(255, 59, 48, 0.12); color: #ff3b30;
      font-size: 14px; font-weight: 600; text-align: center; max-width: 90%;
    }
  </style>
</head>
<body>

  <!-- 상단 도구 막대 -->
  <div id="toolbar">
    <div class="tb-left">
      <button class="btn btn-icon" id="btnPrev" title="이전 페이지 (←)"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button>
      <div class="page-box">
        <input type="number" id="pageNumInput" class="page-input" min="1" value="1">
        <span>/ <span id="pageCount">...</span></span>
      </div>
      <button class="btn btn-icon" id="btnNext" title="다음 페이지 (→)"><svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></button>
    </div>

    <div class="tb-center">
      <span class="tb-title" id="docTitle">경영학 문제집</span>
    </div>

    <div class="tb-right">
      <button class="btn btn-icon" id="btnZoomOut" title="축소 (-)"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="8" y1="11" x2="14" y2="11"/></svg></button>
      <button class="btn" id="btnZoomFit" title="화면 너비 맞춤">너비 맞춤</button>
      <button class="btn btn-icon" id="btnZoomIn" title="확대 (+)"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg></button>
    </div>
  </div>

  <!-- 본문 캔버스 컨테이너 -->
  <div id="viewerContainer">
    <div id="canvasWrapper">
      <canvas id="pdfCanvas"></canvas>
    </div>
    <div id="errorMsg"></div>
  </div>

  <!-- 로딩 스피너 -->
  <div id="loader">
    <div class="spinner"></div>
    <div class="loader-text" id="loaderText">PDF 페이지 스트리밍 로드 중...</div>
  </div>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    const params = new URLSearchParams(location.search);
    const kind = params.get('file') || 'prob';
    const initPage = parseInt(params.get('page') || '1', 10);

    const isWeb = location.hostname && (location.hostname.includes('github.io') || location.hostname.includes('github.com'));
    const isProb = (kind === 'prob');

    document.getElementById('docTitle').textContent = isProb ? '전수환 경영학 문제집' : '전수환 경영학 해설답지';
    document.title = (isProb ? '문제집 p.' : '답지 p.') + initPage + ' · 전수환 경영학';

    // PDF URL 결정 (웹이면 GitHub Releases 스트리밍 직링크, 로컬이면 로컬 파일)
    let pdfUrl = isProb ? 'management_problems_compressed.pdf' : 'management_answers_compressed.pdf';
    if (isWeb) {
      pdfUrl = 'https://github.com/EternalOlive/management/releases/download/v1.0.0-pdf/' + pdfUrl;
    }

    let pdfDoc = null;
    let pageNum = initPage;
    let pageRendering = false;
    let pageNumPending = null;
    let scale = 1.35;
    let fitWidth = true;

    const canvas = document.getElementById('pdfCanvas');
    const ctx = canvas.getContext('2d');
    const container = document.getElementById('viewerContainer');
    const loader = document.getElementById('loader');
    const pageNumInput = document.getElementById('pageNumInput');
    const pageCountEl = document.getElementById('pageCount');

    // ─── 단일 페이지 렌더링 ───
    async function renderPage(num) {
      pageRendering = true;
      pageNumInput.value = num;

      try {
        const page = await pdfDoc.getPage(num);
        let viewport = page.getViewport({ scale: 1.0 });

        if (fitWidth) {
          const availWidth = container.clientWidth - 32;
          scale = Math.min(2.5, Math.max(0.6, availWidth / viewport.width));
        }

        viewport = page.getViewport({ scale: scale });
        const outputScale = window.devicePixelRatio || 1;

        canvas.width = Math.floor(viewport.width * outputScale);
        canvas.height = Math.floor(viewport.height * outputScale);
        canvas.style.width = Math.floor(viewport.width) + "px";
        canvas.style.height = Math.floor(viewport.height) + "px";

        const transform = outputScale !== 1 ? [outputScale, 0, 0, outputScale, 0, 0] : null;

        const renderContext = {
          canvasContext: ctx,
          transform: transform,
          viewport: viewport
        };

        await page.render(renderContext).promise;
        pageRendering = false;
        loader.classList.add('hidden');

        if (pageNumPending !== null) {
          renderPage(pageNumPending);
          pageNumPending = null;
        }
      } catch (err) {
        console.error('Page render error:', err);
        pageRendering = false;
        loader.classList.add('hidden');
      }
    }

    function queueRenderPage(num) {
      if (pageRendering) {
        pageNumPending = num;
      } else {
        renderPage(num);
      }
    }

    function onPrevPage() {
      if (pageNum <= 1) return;
      pageNum--;
      queueRenderPage(pageNum);
      container.scrollTop = 0;
    }

    function onNextPage() {
      if (pageNum >= pdfDoc.numPages) return;
      pageNum++;
      queueRenderPage(pageNum);
      container.scrollTop = 0;
    }

    document.getElementById('btnPrev').addEventListener('click', onPrevPage);
    document.getElementById('btnNext').addEventListener('click', onNextPage);

    pageNumInput.addEventListener('change', () => {
      let v = parseInt(pageNumInput.value, 10);
      if (isNaN(v)) v = pageNum;
      v = Math.max(1, Math.min(pdfDoc.numPages, v));
      pageNum = v;
      queueRenderPage(pageNum);
    });

    document.getElementById('btnZoomIn').addEventListener('click', () => {
      fitWidth = false;
      scale = Math.min(3.0, scale + 0.25);
      queueRenderPage(pageNum);
    });

    document.getElementById('btnZoomOut').addEventListener('click', () => {
      fitWidth = false;
      scale = Math.max(0.5, scale - 0.25);
      queueRenderPage(pageNum);
    });

    document.getElementById('btnZoomFit').addEventListener('click', () => {
      fitWidth = true;
      queueRenderPage(pageNum);
    });

    // 키보드 단축키
    window.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT') return;
      if (e.key === 'ArrowLeft' || e.key === 'k') onPrevPage();
      else if (e.key === 'ArrowRight' || e.key === 'j') onNextPage();
      else if (e.key === '+' || e.key === '=') document.getElementById('btnZoomIn').click();
      else if (e.key === '-') document.getElementById('btnZoomOut').click();
    });

    // ─── PDF 문서 로드 (Range Request 청크 스트리밍 활성화) ───
    async function loadPdf() {
      try {
        const loadingTask = pdfjsLib.getDocument({
          url: pdfUrl,
          rangeChunkSize: 65536 * 4, // 256KB 청크 단위 스트리밍
          disableAutoFetch: true,    // 전체 다운로드 차단!
          disableStream: false
        });

        loadingTask.onProgress = (progress) => {
          if (progress.total > 0) {
            const pct = Math.round(progress.loaded / progress.total * 100);
            document.getElementById('loaderText').textContent = `로드 중... (${pct}%)`;
          }
        };

        pdfDoc = await loadingTask.promise;
        pageCountEl.textContent = pdfDoc.numPages;
        pageNumInput.max = pdfDoc.numPages;

        if (pageNum > pdfDoc.numPages) pageNum = 1;
        renderPage(pageNum);
      } catch (err) {
        console.error('PDF load error:', err);
        loader.classList.add('hidden');
        const errEl = document.getElementById('errorMsg');
        errEl.style.display = 'block';
        errEl.innerHTML = `PDF 문서를 불러올 수 없습니다.<br><small>${err.message || ''}</small>`;
      }
    }

    loadPdf();

    // 창 크기 변경 시 자동 너비 리사이징
    let resizeTimer = null;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        if (fitWidth && pdfDoc) {
          queueRenderPage(pageNum);
        }
      }, 150);
    });
  </script>
</body>
</html>
